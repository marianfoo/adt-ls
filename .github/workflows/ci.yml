name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # Tier 1 only (unit). Binary/SAP-dependent tests are skipIf-gated and run on a
    # self-hosted runner — see docs/plan.md §9.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
